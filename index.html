<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prácticas Psicología · Gestión integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#EEF1F5;--surface:#fff;--surface2:#F6F8FB;--ink:#18233A;--muted:#5A6479;--line:#DCE1E9;--primary:#1E4E9C;--primary-h:#173F80;--on-primary:#fff;--primary-soft:#E5EDF9;--nav:#13213B;--nav-ink:#B9C5DB;--accent:#C8962E;--accent-soft:#F7EDD6;--ok:#2B7A57;--ok-soft:#E2F1E9;--warn:#9A5F0C;--warn-soft:#FAEFD9;--bad:#B0352D;--bad-soft:#FAE3E1;--info:#2F65A8;--info-soft:#E3ECF8;--neutral-soft:#ECEFF3;--shadow:0 1px 2px rgba(19,33,59,.06),0 6px 18px rgba(19,33,59,.05);--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:'Libre Franklin',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--surface:#161F31;--surface2:#1B263B;--ink:#E5EAF2;--muted:#9AA6BB;--line:#2A3650;--primary:#76A0EA;--primary-h:#8FB2F0;--on-primary:#0E1420;--primary-soft:#1C2C4B;--nav:#0A101C;--nav-ink:#9FAECA;--accent:#E0B356;--accent-soft:#3A2E14;--ok:#62C193;--ok-soft:#15302A;--warn:#E3AB4E;--warn-soft:#36290F;--bad:#EF8078;--bad-soft:#3B1C1B;--info:#86AEEC;--info-soft:#1A2A45;--neutral-soft:#222D42;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0E1420;--surface:#161F31;--surface2:#1B263B;--ink:#E5EAF2;--muted:#9AA6BB;--line:#2A3650;--primary:#76A0EA;--primary-h:#8FB2F0;--on-primary:#0E1420;--primary-soft:#1C2C4B;--nav:#0A101C;--nav-ink:#9FAECA;--accent:#E0B356;--accent-soft:#3A2E14;--ok:#62C193;--ok-soft:#15302A;--warn:#E3AB4E;--warn-soft:#36290F;--bad:#EF8078;--bad-soft:#3B1C1B;--info:#86AEEC;--info-soft:#1A2A45;--neutral-soft:#222D42;--shadow:0 1px 2px rgba(0,0,0,.3)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;min-height:100%}
.side{width:258px;flex:none;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.seal{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:600}
.brand b{display:block;color:#fff;font-family:var(--serif);font-size:17px;font-weight:600}
.brand span{font-size:12px;opacity:.8}
.side nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;color:var(--nav-ink);font-size:14px}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#13213B;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.07)}
.who{padding:8px 12px 10px;font-size:12.5px;line-height:1.35}
.who b{display:block;color:#fff;font-size:13.5px;font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top h1{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.menu-btn{display:none}
.persel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.persel select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;color:var(--ink)}
.content{padding:24px 28px 48px;max-width:1280px;width:100%}
.scrim{display:none}
@media (max-width:960px){
 .side{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
 .side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:35}
 .icon-btn.menu-btn{display:inline-grid}
 .top{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
 .top h1{font-size:18px}
 .persel span{display:none}
 .content{padding:16px 14px 40px}
}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;position:relative}
.icon-btn .dotn{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:18px;margin-bottom:12px}
.stack>*+*{margin-top:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-soft);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--warn)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:default}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--primary)}
.kpi .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}.kpi.info .v{color:var(--primary)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:140px;max-width:100%}
.filters .q{flex:1 1 240px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child{min-width:190px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
td .sub{display:block;font-size:12.5px;color:var(--muted)}
.count{font-size:13px;color:var(--muted);margin:0 0 8px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:4px}
.bar{height:7px;border-radius:5px;background:var(--neutral-soft);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:5px}
.bar.full>i{background:var(--bad)}
.occ{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.occ .bar{flex:1}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px}
.fld>span{font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;width:100%}
.fld textarea{resize:vertical}
.fld small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form h4{grid-column:1/-1;font-size:15px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
#modal{position:fixed;inset:0;background:rgba(10,16,28,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 14px max(24px,env(safe-area-inset-bottom,0px))}
#modal.open{display:flex}
.mbox{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin:auto 0}
.mbox.wide{max-width:900px}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{flex:1;font-size:19px}
.mbody{padding:20px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 14px 14px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:10px;border:1px solid;font-size:14px}
.alert svg{margin-top:2px}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.alert.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--info)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.alert b{color:inherit}
.alert .t{color:var(--ink)}
/* Ruta de práctica */
.ruta{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));counter-reset:r}
.ruta li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 4px}
.ruta li::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.ruta li:first-child::before{display:none}
.ruta li.done::before,.ruta li.cur::before{background:var(--ok)}
.ruta li.skip::before{background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 9px)}
.ruta .dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.ruta .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.ruta .cur .dot{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 5px var(--accent-soft)}
.ruta .skip .dot{border-style:dashed;color:var(--muted)}
.ruta .lbl{font-size:12.5px;line-height:1.25;color:var(--muted)}
.ruta .done .lbl{color:var(--ink)}
.ruta .cur .lbl{color:var(--ink);font-weight:700}
.ruta small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.ruta .dot svg{width:16px;height:16px;stroke-width:2.6}
.ruta.compact .dot{width:28px;height:28px;font-size:12px}
.ruta.compact li::before{top:13px}
.ruta.compact .lbl{font-size:11.5px}
@media (max-width:760px){
 .ruta{grid-template-columns:1fr;gap:0}
 .ruta li{flex-direction:row;text-align:left;padding:0 0 14px 0}
 .ruta li::before{left:16px;top:-50%;width:3px;height:100%}
 .ruta.compact li::before{left:12px}
 .ruta li:first-child::before{display:none}
}
/* Escenarios cards */
.escs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.esc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--ac,var(--primary));position:relative}
.esc h3{font-size:18px}
.esc .meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.esc .req{font-size:13px;background:var(--surface2);border-radius:8px;padding:9px 11px}
.esc .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:6px}
.stamp{position:absolute;top:14px;right:14px;border:2px solid var(--bad);color:var(--bad);font-weight:800;font-size:11.5px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;transform:rotate(4deg);background:var(--surface)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.hero h2{font-size:30px}
.now{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-left:5px solid var(--accent)}
@media (max-width:640px){.now{grid-template-columns:1fr}}
.now .k{font-size:13px;color:var(--muted);font-weight:600}
.now h3{font-size:22px;margin:2px 0 6px}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 14px}
.tl li::before{content:"";position:absolute;left:-27px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
.tl .d{font-size:13px;font-weight:700;color:var(--primary)}
.tl .ty{font-weight:600}
.tl .tx{font-size:14px;margin-top:3px;white-space:pre-wrap}
.tl .mt{font-size:12px;color:var(--muted);margin-top:4px}
.cal{list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.cal li:last-child{border-bottom:0}
.cal .f{font-family:var(--serif);font-weight:600;font-size:16px}
.cal li.past{opacity:.55}
.cal li.next .f{color:var(--accent)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(110px,190px) 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.hb .bar{height:12px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .n{text-align:right;font-weight:700}
.stack-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--neutral-soft)}
.stack-bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.notif{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif.new{background:var(--primary-soft)}
.notif .d{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--primary);border-color:var(--primary)}
.split{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow-y:auto}
.pitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.pitem.on{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.pitem b{display:block;font-size:14px}
.pitem span{font-size:12.5px;color:var(--muted)}
/* Login */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:var(--nav);color:var(--nav-ink);padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.login .l h1{color:#fff;font-size:40px;line-height:1.1;margin:22px 0 14px}
.login .l p{max-width:46ch;font-size:15.5px}
.flow{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 4px;font-size:12.5px}
.flow li{display:flex;align-items:center;gap:4px}
.flow li+li::before{content:"";width:14px;height:1px;background:var(--accent);margin-right:4px}
.login .r{display:flex;align-items:center;justify-content:center;padding:40px 22px}
.lbox{width:100%;max-width:420px}
.lbox h2{font-size:26px;margin-bottom:6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.role{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.role b{font-size:14.5px}
.role span{font-size:12px;color:var(--muted)}
.role.on{border-color:var(--primary);background:var(--primary-soft)}
.demo{margin-top:18px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .l{padding:32px 24px}.login .l h1{font-size:30px}}

<body>

<script>
'use strict';
const KEY='practicasPsico.v1', SKEY='practicasPsico.sesion';
let S=null, sess=null, view='', F={}, curTabla=null, _ok=null;
const AREAS_DEF=['Clínica','Organizacional','Educativa','Social/comunitaria'];
const MAT={pendiente:'Pendiente',matriculado:'Matriculado financieramente',no_matriculado:'No matriculado',validacion:'Validación pendiente'};
const MAT_T={pendiente:'warn',matriculado:'ok',no_matriculado:'bad',validacion:'info'};
const EST_SOL={pendiente_validacion:'Pendiente de validación',pendiente_entrevista:'Pendiente de entrevista',asignacion_provisional:'Asignación provisional',confirmada:'Escenario confirmado',no_aprobada:'Selección no aprobada',anulada:'Anulada / liberada'};
const EST_T={pendiente_validacion:'info',pendiente_entrevista:'warn',asignacion_provisional:'warn',confirmada:'ok',no_aprobada:'bad',anulada:'neutral'};
const ACTIVOS=['pendiente_validacion','pendiente_entrevista','asignacion_provisional','confirmada'];
const OCUPA=['pendiente_validacion','asignacion_provisional','confirmada'];
const ASIG=['asignacion_provisional','confirmada'];
const TIPOS_SEG=['Reunión inicial','Seguimiento','Observación','Visita al escenario','Compromiso','Evaluación','Cierre'];
const EST_PROC=['En curso','En curso con alertas','Suspendido','Finalizado'];
const NOTIF_TIPOS={seleccion:'Selección de escenario registrada',entrevista:'Entrevista requerida / pendiente',aprobado:'Resultado de la selección o entrevista',matricula:'Matrícula financiera pendiente',confirmado:'Escenario de práctica confirmado',carta:'Carta Aval disponible',cierre:'Cierre próximo del período de selección'};
const PLANTILLA=`{{ciudad}}, {{fecha}}

Señores
{{empresa}}
Atn. {{contacto}}
{{ciudad_empresa}}

Asunto: Carta aval para práctica profesional

Reciban un cordial saludo.

La {{institucion}}, a través de la Coordinación de Prácticas Institucionales, presenta y avala a {{estudiante}}, identificado(a) con {{tipo_documento}} No. {{documento}} y código estudiantil {{codigo}}, estudiante del programa de {{programa}}, para realizar su práctica profesional en el área {{area}}, desempeñando el rol de {{cargo}}, durante el período académico {{periodo}}.

El (la) estudiante cumple con los requisitos académicos y financieros establecidos por la institución para el desarrollo de su práctica y contará con el acompañamiento de un docente supervisor del programa.

Agradecemos la oportunidad que brindan a nuestro(a) estudiante para fortalecer su formación profesional.

Cordialmente,`;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ahora=()=>new Date().toISOString();
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fD(s){if(!s)return '—';const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return String(s);return `${m[3]}/${m[2]}/${m[1]}`}
function fDH(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return fD(s);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}
function fDL(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return fD(s);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})}
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
function titulo(s){const men=['de','del','la','las','los','y','e'];return String(s??'').replace(/\u00a0/g,' ').trim().toLowerCase().replace(/\s+/g,' ').split(' ').map((w,i)=>i&&men.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ')}
const nombreCompleto=e=>e?(e.nombres+' '+e.apellidos).trim():'—';
const E=id=>S.estudiantes.find(x=>x.id===id);
const ESC=id=>S.escenarios.find(x=>x.id===id);
const D=id=>S.docentes.find(x=>x.id===id);
const SOL=id=>S.solicitudes.find(x=>x.id===id);
const P=id=>S.periodos.find(x=>x.id===id);
function per(){return P(S.periodoActual)||S.periodos[0]}
const perDe=est=>P(est.periodoId);
const estP=()=>S.estudiantes.filter(e=>e.periodoId===per().id);
const escP=tipo=>S.escenarios.filter(e=>e.periodoId===per().id&&(!tipo||e.tipo===tipo));
const solP=()=>S.solicitudes.filter(s=>s.periodoId===per().id);
function nombreEsc(e){return e?(e.tipo==='vacante'&&e.cargo?e.nombre+' · '+e.cargo:e.nombre):'—'}
function docenteDe(s){return s?D(s.docenteId||(ESC(s.escenarioId)||{}).docenteId):null}
const desc=s=>`${nombreCompleto(E(s.estudianteId))} · ${nombreEsc(ESC(s.escenarioId))}`;
const AREA_COL={'Clínica':'#2F65A8','Organizacional':'#C8962E','Educativa':'#2B7A57','Social/comunitaria':'#8A4FA0'};
const areaCol=a=>AREA_COL[a]||'#5A6479';

const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/>',building:'<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',card:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>',teach:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 21l4-5 4 5"/>',eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',chart:'<path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',route:'<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',home:'<path d="m3 11 9-8 9 8M5 9.5V21h14V9.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',down:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',tick:'<path d="m5 12 5 5 9-10"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- persistencia ---------- */
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador. Descarga un respaldo desde Configuración.','err')}}
function cargar(){
 try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);migrar();return}}catch(e){}
 S=seed();guardar();
}
function migrar(){
 S.config=Object.assign(seedConfig(),S.config||{});
 S.config.notif=Object.assign(seedConfig().notif,S.config.notif||{});
 ['periodos','escenarios','estudiantes','docentes','solicitudes','seguimientos','cartas','notifs','audit'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
}
function seedConfig(){return{areas:[...AREAS_DEF],cartaAreas:['Organizacional'],diasAviso:7,notif:{seleccion:true,entrevista:true,aprobado:true,matricula:true,confirmado:true,carta:true,cierre:true},claveAdmin:'admin',claveProg:'programa',institucion:'Corporación Universitaria Reformada',programa:'Psicología',ciudad:'Barranquilla',responsable:'Yolima Gómez',cargoResponsable:'Coordinadora General de Prácticas Institucionales',plantilla:PLANTILLA}}

/* ---------- toasts, modales, formularios ---------- */
function toast(msg,tipo){const t=document.createElement('div');t.className='toast '+(tipo||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4600)}
function modal(title,body,o={}){
 $('#modal').innerHTML=`<div class="mbox ${o.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mhead"><h3>${esc(title)}</h3><button class="icon-btn" onclick="cerrarModal()" aria-label="Cerrar">${ic('x')}</button></div><div class="mbody">${body}</div>${o.foot?`<div class="mfoot">${o.foot}</div>`:''}</div>`;
 $('#modal').classList.add('open');$('#modal').scrollTop=0;
}
function cerrarModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function confirmar(tit,html,fn,btn,danger){_ok=fn;modal(tit,html,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn ${danger?'danger':'pri'}" onclick="const f=_ok;cerrarModal();f&&f()">${esc(btn||'Confirmar')}</button>`})}
function fld(label,name,val,type,o){
 type=type||'text';o=o||{};const id='f_'+name;let inp;
 if(type==='select')inp=`<select id="${id}">${o.options.map(op=>{const [v,t]=Array.isArray(op)?op:[op,op];return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
 else if(type==='textarea')inp=`<textarea id="${id}" rows="${o.rows||3}">${esc(val)}</textarea>`;
 else if(type==='check')return `<label class="chk ${o.cls||''}"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(label)}</label>`;
 else inp=`<input id="${id}" type="${type}" value="${esc(val)}" ${o.min!=null?`min="${o.min}"`:''} ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`;
 return `<label class="fld ${o.cls||''}" for="${id}"><span>${esc(label)}${o.req?' *':''}</span>${inp}${o.help?`<small>${esc(o.help)}</small>`:''}</label>`;
}
function leer(names){const o={};names.forEach(n=>{const el=document.getElementById('f_'+n);if(!el)return;o[n]=el.type==='checkbox'?el.checked:el.value.trim()});return o}
const chip=(t,tone)=>`<span class="chip ${tone||''}">${esc(t)}</span>`;
const chipMat=m=>chip(MAT[m]||'Pendiente',MAT_T[m]||'warn');
function textoSol(s){if(!s)return 'Sin escenario';if(s.estado==='asignacion_provisional'){const e=E(s.estudianteId);if(e&&e.matricula!=='matriculado')return 'Aprobada · pendiente de matrícula financiera'}return EST_SOL[s.estado]}
const chipSol=s=>s?chip(textoSol(s),EST_T[s.estado]):chip('Sin escenario','');
function chipEsc(e){const st=estadoEsc(e);const lab=st==='Completo'?(e.tipo==='vacante'?'Vacantes asignadas':'Cupo completo'):st;return chip(lab,{Disponible:'ok','En proceso':'info',Completo:'bad',Cerrado:''}[st])}
function barra(v,max){const p=max?Math.min(100,Math.round(v/max*100)):0;return `<div class="bar ${v>=max&&max?'full':''}"><i style="width:${p}%"></i></div>`}
function opts(arr,todos){return (todos?[['',todos]]:[]).concat(arr)}

/* ---------- auditoría y notificaciones ---------- */
function quien(){if(!sess)return 'Sistema';if(sess.rol==='admin')return 'Administrador';if(sess.rol==='prog')return 'Programa de Psicología';if(sess.rol==='est'){const e=E(sess.id);return 'Estudiante: '+nombreCompleto(e)}const d=D(sess.id);return 'Docente: '+(d?d.nombre:'')}
function log(accion,detalle){S.audit.unshift({id:uid('a'),fecha:ahora(),usuario:quien(),accion,detalle});if(S.audit.length>5000)S.audit.length=5000}
function notificar(tipo,para,texto){if(tipo&&S.config.notif[tipo]===false)return;S.notifs.unshift({id:uid('n'),para,texto,fecha:ahora(),leida:false});if(S.notifs.length>8000)S.notifs.length=8000}
function hist(s,t){(s.historial=s.historial||[]).push({fecha:ahora(),texto:t,usuario:quien()})}

/* ---------- reglas de negocio ---------- */
function ocupados(escId){return S.solicitudes.filter(s=>s.escenarioId===escId&&OCUPA.includes(s.estado)).length}
function libres(e){return Math.max(0,(+e.cupos||0)-ocupados(e.id))}
function estadoEsc(e){if(e.cerrado)return 'Cerrado';if(libres(e)<=0)return 'Completo';if(ocupados(e.id)>0||S.solicitudes.some(s=>s.escenarioId===e.id&&s.estado==='pendiente_entrevista'))return 'En proceso';return 'Disponible'}
function solActiva(estId){return S.solicitudes.find(s=>s.estudianteId===estId&&ACTIVOS.includes(s.estado))}
function selAbierta(p){if(!p)return false;if(p.seleccion==='abierta')return true;if(p.seleccion==='cerrada')return false;const h=hoyISO();return(!p.aperturaSel||h>=p.aperturaSel)&&(!p.cierreSel||h<=p.cierreSel)}
function vencida(e){return e.tipo==='vacante'&&e.fechaLimite&&hoyISO()>e.fechaLimite}
function esCarta(s){const e=s&&ESC(s.escenarioId);return !!(e&&S.config.cartaAreas.includes(e.area))}

function crearSolicitud(est,esc,origen){
 if(esc.periodoId!==est.periodoId)throw new Error('El escenario no pertenece al período académico del estudiante.');
 if(solActiva(est.id))throw new Error(`${nombreCompleto(est)} ya tiene una selección activa en este período. Debe liberarse antes de registrar otra.`);
 if(esc.cerrado)throw new Error('Este escenario está cerrado.');
 if(libres(esc)<=0)throw new Error(`CUPO COMPLETO: ${esc.nombre} no tiene cupos disponibles.`);
 const s={id:uid('s'),periodoId:est.periodoId,estudianteId:est.id,escenarioId:esc.id,fecha:ahora(),estado:esc.requiereEntrevista?'pendiente_entrevista':'pendiente_validacion',entrevista:esc.requiereEntrevista?{estado:'Pendiente',fecha:'',observaciones:''}:null,docenteId:'',historial:[]};
 hist(s,origen);S.solicitudes.push(s);return s;
}
function postAprob(s){const est=E(s.estudianteId);notificar('aprobado','est:'+est.id,`Tu escenario fue aprobado: ${nombreEsc(ESC(s.escenarioId))}.`);if(est.matricula!=='matriculado')notificar('matricula','est:'+est.id,'Tu matrícula financiera está pendiente. Es requisito para que tu escenario quede confirmado.')}
/* Regla 4: confirmación automática solo con matrícula financiera vigente */
function sincronizar(){
 S.solicitudes.forEach(s=>{
  const est=E(s.estudianteId);if(!est)return;
  if(s.estado==='asignacion_provisional'&&est.matricula==='matriculado'){
   s.estado='confirmada';s.fechaConfirmacion=ahora();hist(s,'Escenario de práctica confirmado automáticamente (selección aprobada + matrícula financiera vigente)');
   notificar('confirmado','est:'+est.id,`Tu escenario de práctica ha sido confirmado: ${nombreEsc(ESC(s.escenarioId))}.`);
   if(esCarta(s))notificar('carta','est:'+est.id,'Tu Carta Aval está disponible.');
   S.audit.unshift({id:uid('a'),fecha:ahora(),usuario:'Sistema',accion:'Confirmación automática',detalle:desc(s)});
  }else if(s.estado==='confirmada'&&est.matricula!=='matriculado'){
   s.estado='asignacion_provisional';s.fechaConfirmacion=null;hist(s,'Confirmación revertida: la matrícula financiera dejó de estar vigente');
   S.audit.unshift({id:uid('a'),fecha:ahora(),usuario:'Sistema',accion:'Confirmación revertida',detalle:desc(s)});
  }
 });
}
function act(fn){try{const r=fn();sincronizar();guardar();render();return r}catch(e){toast(e.message||String(e),'err');console.error(e)}}

/* ---------- etapas del proceso ---------- */
function etapas(est){
 const p=perDe(est);const sols=S.solicitudes.filter(s=>s.estudianteId===est.id);const s=solActiva(est.id);const esc=s?ESC(s.escenarioId):null;
 const reqE=esc&&esc.requiereEntrevista;const val=s&&ASIG.includes(s.estado);const conf=s&&s.estado==='confirmada';
 const org=s&&esCarta(s);
 return [
  {k:'Consulta de escenarios',done:sols.length>0||!!s},
  {k:'Selección / postulación',done:!!s},
  {k:'Entrevista',done:!!(s&&reqE&&s.estado!=='pendiente_entrevista'),skip:!!(s&&!reqE),opt:true},
  {k:'Validación',done:!!val},
  {k:'Matrícula financiera',done:est.matricula==='matriculado'},
  {k:'Asignación confirmada',done:!!conf},
  {k:'Carta Aval',done:!!(s&&S.cartas.some(c=>c.solicitudId===s.id)),skip:!!(s&&!org),opt:true},
  {k:'Inicio de práctica',done:!!(conf&&p&&p.inicioPractica&&hoyISO()>=p.inicioPractica)},
  {k:'Supervisión y seguimiento',done:!!(s&&S.seguimientos.some(g=>g.solicitudId===s.id))}
 ];
}
function etapaActual(est){const st=etapas(est);const i=st.findIndex(x=>!x.done&&!x.skip);return i<0?'Proceso al día':st[i].k}
function ruta(est,compact){
 const st=etapas(est);const cur=st.findIndex(x=>!x.done&&!x.skip);
 return `<ol class="ruta ${compact?'compact':''}" aria-label="Ruta de práctica">${st.map((x,i)=>{const c=x.skip?'skip':x.done?'done':i===cur?'cur':'todo';return `<li class="${c}"${i===cur?' aria-current="step"':''}><span class="dot">${x.done?ic('tick'):x.skip?'–':i+1}</span><span class="lbl">${x.k}${x.skip?'<small>No aplica</small>':x.opt&&!x.done&&i!==cur?'<small>Si aplica</small>':''}</span></li>`}).join('')}</ol>`;
}
function pendientesDe(est){const s=solActiva(est.id);const r=[];if(!s)r.push('Sin escenario asignado');else{if(s.estado==='pendiente_entrevista')r.push('Entrevista pendiente');if(s.estado==='pendiente_validacion')r.push('Selección pendiente de validación')}if(est.matricula!=='matriculado')r.push('Matrícula financiera: '+MAT[est.matricula]);return r}
/* ---------- datos de demostración (ficticios) ---------- */
function seed(){
 let r=11;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};const pick=a=>a[Math.floor(rnd()*a.length)];
 const st={version:1,config:seedConfig(),periodoActual:'p2027-1',periodos:[],escenarios:[],estudiantes:[],docentes:[],solicitudes:[],seguimientos:[],cartas:[],notifs:[],audit:[]};

function vEntrevistas(){F.ent=F.ent||{q:'',estado:'Pendiente',esc:''};const f=F.ent;curTabla=tablaEnt;
 return `<div class="alert info">${ic('info')}<div class="t">La asignación definitiva en escenarios con entrevista solo se habilita cuando el resultado es <b>Aprobado</b> y aún hay cupos. Si el resultado es No aprobado, el estudiante puede elegir otro escenario.</div></div><div style="height:14px"></div>
 <div class="filters"><input class="q" type="search" placeholder="Buscar estudiante" value="${esc(f.q)}" oninput="F.ent.q=this.value;tablaEnt()" aria-label="Buscar"><select onchange="F.ent.estado=this.value;tablaEnt()" aria-label="Estado de la entrevista">${opts(['Pendiente','Aprobado','No aprobado'],'Todas').map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${v}" ${f.estado===v?'selected':''}>${t}</option>`}).join('')}</select><select onchange="F.ent.esc=this.value;tablaEnt()" aria-label="Escenario"><option value="">Todos los escenarios</option>${escP().filter(e=>e.requiereEntrevista).map(e=>`<option value="${e.id}" ${f.esc===e.id?'selected':''}>${esc(nombreEsc(e))}</option>`).join('')}</select></div><div id="tbl"></div>`}
function tablaEnt(){const f=F.ent,q=norm(f.q);const l=solP().filter(s=>s.entrevista&&s.estado!=='anulada').filter(s=>{const e=E(s.estudianteId);if(q&&!norm(nombreCompleto(e)+' '+e.documento).includes(q))return false;if(f.estado&&s.entrevista.estado!==f.estado)return false;if(f.esc&&s.escenarioId!==f.esc)return false;return true}).sort((a,b)=>(a.entrevista.fecha||'9').localeCompare(b.entrevista.fecha||'9'));
 $('#tbl').innerHTML=`<p class="count">${l.length} procesos de entrevista</p>`+(l.length?`<div class="tbl"><table><thead><tr><th>Estudiante</th><th>Escenario</th><th>Cupos libres</th><th>Fecha de entrevista</th><th>Resultado</th><th>Solicitud</th><th></th></tr></thead><tbody>${l.map(s=>{const e=E(s.estudianteId),es=ESC(s.escenarioId),en=s.entrevista;return `<tr><td><b>${esc(nombreCompleto(e))}</b><span class="sub">${esc(e.documento)}</span></td><td>${esc(nombreEsc(es))}<span class="sub">${esc(es.modalidadEntrevista||'')}</span></td><td>${libres(es)} de ${es.cupos}</td><td>${en.fecha?fDH(en.fecha):'<span class="muted">Sin programar</span>'}</td><td>${chip(en.estado,{Pendiente:'warn',Aprobado:'ok','No aprobado':'bad'}[en.estado])}${en.observaciones?`<span class="sub">${esc(en.observaciones)}</span>`:''}</td><td>${chipSol(s)}</td><td>${s.estado==='pendiente_entrevista'?`<button class="btn sm pri" onclick="formEntrevista('${s.id}')">Registrar</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="card empty"><b>No hay entrevistas con estos filtros</b>Las entrevistas aparecen cuando un estudiante selecciona un escenario que la requiere.</div>`)}
function formEntrevista(id){const s=SOL(id),e=E(s.estudianteId),es=ESC(s.escenarioId),en=s.entrevista||{};
 modal('Entrevista · '+nombreCompleto(e),`<p class="muted">${esc(nombreEsc(es))} · ${libres(es)} cupos libres</p><div class="form">${fld('Fecha y hora','ent_fecha',en.fecha,'datetime-local')}${fld('Estado','ent_estado',en.estado||'Pendiente','select',{options:['Pendiente','Aprobado','No aprobado']})}${fld('Resultado y observaciones','ent_obs',en.observaciones,'textarea',{cls:'full'})}</div>`,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="guardarEntrevista('${id}')">Guardar resultado</button>`})}
function guardarEntrevista(id){act(()=>{const s=SOL(id),es=ESC(s.escenarioId),est=E(s.estudianteId);const v=leer(['ent_fecha','ent_estado','ent_obs']);
 if(s.estado!=='pendiente_entrevista')throw new Error('Esta solicitud ya no está pendiente de entrevista.');
 if(v.ent_estado==='Aprobado'&&libres(es)<=0)throw new Error('CUPO COMPLETO: no quedan cupos en este escenario para aprobar la entrevista.');
 s.entrevista=Object.assign({},s.entrevista,{fecha:v.ent_fecha,observaciones:v.ent_obs,estado:v.ent_estado,registrado:ahora()});
 if(v.ent_estado==='Aprobado'){s.estado='asignacion_provisional';hist(s,'Entrevista aprobada');postAprob(s)}
 else if(v.ent_estado==='No aprobado'){s.estado='no_aprobada';hist(s,'Entrevista no aprobada'+(v.ent_obs?': '+v.ent_obs:''));notificar('aprobado','est:'+est.id,`El resultado de tu entrevista en ${es.nombre} fue no aprobado. Puedes elegir otro escenario.`)}
 else{hist(s,'Entrevista programada'+(v.ent_fecha?' para el '+fDH(v.ent_fecha):''));notificar('entrevista','est:'+est.id,`Tu entrevista está pendiente${v.ent_fecha?': '+fDH(v.ent_fecha):''} · ${es.nombre}.`)}
 log('Registro de entrevista',desc(s)+' · '+v.ent_estado);cerrarModal();toast('Entrevista registrada')})}

/* ---- asignaciones ---- */
function vAsignaciones(){F.asg=F.asg||{q:'',estado:'',area:'',esc:''};const f=F.asg;curTabla=tablaAsg;const pv=solP().filter(s=>s.estado==='pendiente_validacion').length;
 return `<div class="filters"><input class="q" type="search" placeholder="Buscar estudiante" value="${esc(f.q)}" oninput="F.asg.q=this.value;tablaAsg()" aria-label="Buscar"><select onchange="F.asg.estado=this.value;tablaAsg()" aria-label="Estado"><option value="">Selecciones activas</option>${Object.entries(EST_SOL).map(([k,t])=>`<option value="${k}" ${f.estado===k?'selected':''}>${t}</option>`).join('')}<option value="todas" ${f.estado==='todas'?'selected':''}>Todas, incluidas anuladas</option></select><select onchange="F.asg.area=this.value;tablaAsg()" aria-label="Área">${opts(S.config.areas,'Todas las áreas').map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${f.area===v?'selected':''}>${esc(t)}</option>`}).join('')}</select><select onchange="F.asg.esc=this.value;tablaAsg()" aria-label="Escenario"><option value="">Todos los escenarios</option>${escP().map(e=>`<option value="${e.id}" ${f.esc===e.id?'selected':''}>${esc(nombreEsc(e))}</option>`).join('')}</select><span class="spacer"></span>${pv?`<button class="btn ok" onclick="aprobarTodas()">${ic('tick')} Aprobar ${pv} pendientes</button>`:''}<button class="btn pri" onclick="formAsignar()">${ic('plus')} Asignar estudiante</button></div><div id="tbl"></div>`}
function tablaAsg(){const f=F.asg,q=norm(f.q);const l=solP().filter(s=>{const e=E(s.estudianteId),es=ESC(s.escenarioId);if(!e||!es)return false;if(q&&!norm(nombreCompleto(e)+' '+e.documento+' '+e.codigo).includes(q))return false;if(f.estado==='todas'){}else if(f.estado){if(s.estado!==f.estado)return false}else if(!ACTIVOS.includes(s.estado))return false;if(f.area&&es.area!==f.area)return false;if(f.esc&&s.escenarioId!==f.esc)return false;return true}).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('#tbl').innerHTML=`<p class="count">${l.length} registros</p>`+(l.length?`<div class="tbl"><table><thead><tr><th>Estudiante</th><th>Escenario</th><th>Seleccionado</th><th>Estado</th><th>Matrícula fin.</th><th>Docente</th><th>Acciones</th></tr></thead><tbody>${l.map(s=>{const e=E(s.estudianteId),es=ESC(s.escenarioId),d=docenteDe(s);const a=[];
  if(s.estado==='pendiente_validacion')a.push(`<button class="btn sm ok" onclick="aprobar('${s.id}')">Aprobar</button>`);
  if(s.estado==='pendiente_entrevista')a.push(`<button class="btn sm" onclick="formEntrevista('${s.id}')">Entrevista</button>`);
  if(['pendiente_validacion','pendiente_entrevista'].includes(s.estado))a.push(`<button class="btn sm danger" onclick="formRechazar('${s.id}')">No aprobar</button>`);
  if(ASIG.includes(s.estado))a.push(`<button class="btn sm" onclick="formDocente('${s.id}')">Docente</button><button class="btn sm" onclick="formReasignar('${s.id}')">Reasignar</button><button class="btn sm danger" onclick="formLiberar('${s.id}')">Liberar</button>`);
  return `<tr><td><b class="click" style="cursor:pointer" onclick="fichaEst('${e.id}')">${esc(nombreCompleto(e))}</b><span class="sub">${esc(e.documento)}</span></td><td>${esc(nombreEsc(es))}<span class="sub">${esc(es.area)}${es.requiereEntrevista?' · con entrevista':''}</span></td><td class="small">${fDH(s.fecha)}</td><td>${chipSol(s)}${s.fechaConfirmacion?`<span class="sub">Confirmado ${fDL(s.fechaConfirmacion)}</span>`:''}</td><td>${chipMat(e.matricula)}</td><td class="small">${esc(d?d.nombre:'—')}</td><td><div class="row" style="flex-wrap:nowrap">${a.join('')}</div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="card empty"><b>No hay asignaciones con estos filtros</b>Las selecciones de los estudiantes aparecerán aquí para su validación.</div>`)}
function aprobar(id){act(()=>{const s=SOL(id);if(s.estado!=='pendiente_validacion')throw new Error('Solo se aprueban selecciones pendientes de validación.');s.estado='asignacion_provisional';hist(s,'Selección aprobada por la coordinación');postAprob(s);log('Aprobación de selección',desc(s));toast('Selección aprobada')})}
function aprobarTodas(){const l=solP().filter(s=>s.estado==='pendiente_validacion');confirmar('Aprobar selecciones',`<p>Se aprobarán ${l.length} selecciones pendientes de validación. Cada una quedará en asignación provisional hasta que el estudiante tenga matrícula financiera vigente.</p>`,()=>act(()=>{l.forEach(s=>{s.estado='asignacion_provisional';hist(s,'Selección aprobada por la coordinación (aprobación masiva)');postAprob(s)});log('Aprobación masiva',l.length+' selecciones');toast(l.length+' selecciones aprobadas')}),'Aprobar todas')}
function formMotivo(tit,txt,btn,fnName,id,danger){modal(tit,`<p>${txt}</p>${fld('Motivo','motivo','','textarea',{req:1})}`,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn ${danger?'danger':'pri'}" onclick="${fnName}('${id}')">${btn}</button>`})}
function formRechazar(id){formMotivo('No aprobar selección',esc(desc(SOL(id))),'No aprobar','doRechazar',id,true)}
function doRechazar(id){act(()=>{const m=leer(['motivo']).motivo;if(!m)throw new Error('Escribe el motivo.');const s=SOL(id);s.estado='no_aprobada';if(s.entrevista&&s.entrevista.estado==='Pendiente')s.entrevista.estado='No aprobado';hist(s,'Selección no aprobada: '+m);notificar('aprobado','est:'+s.estudianteId,`Tu selección en ${(ESC(s.escenarioId)||{}).nombre} no fue aprobada. Motivo: ${m}`);log('Selección no aprobada',desc(s)+' · '+m);cerrarModal()})}
function formLiberar(id){formMotivo('Liberar cupo',`Se anulará la selección de ${esc(desc(SOL(id)))} y el cupo quedará disponible. Quedará registrado en el historial.`,'Liberar cupo','doLiberar',id,true)}
function doLiberar(id){act(()=>{const m=leer(['motivo']).motivo;if(!m)throw new Error('Escribe el motivo.');const s=SOL(id);s.estado='anulada';s.fechaConfirmacion=null;hist(s,'Cupo liberado por la coordinación: '+m);notificar(null,'est:'+s.estudianteId,`Tu asignación en ${(ESC(s.escenarioId)||{}).nombre} fue liberada por la coordinación. Motivo: ${m}`);log('Liberación de cupo',desc(s)+' · '+m);cerrarModal()})}
function selEscLibres(excluir,pid){return escP().filter(e=>e.periodoId===pid&&e.id!==excluir&&!e.cerrado&&libres(e)>0).map(e=>[e.id,`${nombreEsc(e)} · ${e.area} · ${libres(e)} libres${e.requiereEntrevista?' · entrevista':''}`])}
function formAsignar(estId){const sinEsc=estP().filter(e=>!solActiva(e.id)).sort((a,b)=>nombreCompleto(a).localeCompare(nombreCompleto(b)));const lib=selEscLibres('',per().id);
 if(!lib.length){toast('No hay escenarios con cupos libres en este período.','err');return}
 modal('Asignar escenario',`<p class="muted">Solo se listan escenarios con cupos libres. Si el escenario requiere entrevista, la asignación queda pendiente de entrevista.</p><div class="form">${fld('Estudiante','a_est',estId||'','select',{options:estId?[[estId,nombreCompleto(E(estId))]]:[['','Elige un estudiante sin escenario']].concat(sinEsc.map(e=>[e.id,nombreCompleto(e)+' · '+e.documento+(e.area1?' · '+e.area1:'')]))})}${fld('Escenario','a_esc','','select',{options:[['','Elige un escenario']].concat(lib)})}${fld('Docente supervisor (opcional)','a_doc','','select',{options:[['','El del escenario']].concat(S.docentes.map(d=>[d.id,d.nombre]))})}</div>`,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="doAsignar()">Asignar</button>`})}
function doAsignar(){act(()=>{const v=leer(['a_est','a_esc','a_doc']);if(!v.a_est||!v.a_esc)throw new Error('Elige el estudiante y el escenario.');const est=E(v.a_est),es=ESC(v.a_esc);const s=crearSolicitud(est,es,'Asignación realizada por la coordinación');s.docenteId=v.a_doc;if(!es.requiereEntrevista){s.estado='asignacion_provisional';hist(s,'Aprobada por la coordinación');postAprob(s)}else notificar('entrevista','est:'+est.id,'Este escenario requiere entrevista. La selección del escenario no garantiza la asignación.');log('Asignación por coordinación',desc(s));cerrarModal();toast('Asignación registrada')})}
function formReasignar(id){const s=SOL(id);const lib=selEscLibres(s.escenarioId,s.periodoId);if(!lib.length){toast('No hay otros escenarios con cupos libres.','err');return}
 modal('Reasignar · '+nombreCompleto(E(s.estudianteId)),`<p class="muted">Actual: ${esc(nombreEsc(ESC(s.escenarioId)))}. El cambio queda registrado y libera el cupo anterior.</p><div class="form">${fld('Nuevo escenario','r_esc','','select',{options:[['','Elige un escenario']].concat(lib),cls:'full'})}${fld('Motivo del cambio','motivo','','textarea',{cls:'full',req:1})}</div>`,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="doReasignar('${id}')">Reasignar</button>`})}
function doReasignar(id){act(()=>{const v=leer(['r_esc','motivo']);if(!v.r_esc||!v.motivo)throw new Error('Elige el escenario y escribe el motivo.');const s=SOL(id),est=E(s.estudianteId),nu=ESC(v.r_esc);if(nu.cerrado||libres(nu)<=0)throw new Error('CUPO COMPLETO en el nuevo escenario.');const ant=nombreEsc(ESC(s.escenarioId));s.estado='anulada';s.fechaConfirmacion=null;hist(s,`Reasignado a ${nombreEsc(nu)}: ${v.motivo}`);const n=crearSolicitud(est,nu,`Reasignación desde ${ant}: ${v.motivo}`);if(!nu.requiereEntrevista){n.estado='asignacion_provisional';postAprob(n)}log('Cambio de asignación',`${nombreCompleto(est)}: ${ant} → ${nombreEsc(nu)} · ${v.motivo}`);cerrarModal();toast('Reasignación registrada')})}
function formDocente(id){const s=SOL(id),d=docenteDe(s);modal('Docente supervisor',`<p class="muted">${esc(desc(s))}</p>${fld('Docente','dsel',s.docenteId||'','select',{options:[['',`El del escenario (${(D(ESC(s.escenarioId).docenteId)||{}).nombre||'sin asignar'})`]].concat(S.docentes.map(x=>[x.id,x.nombre]))})}`,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="doDocente('${id}')">Guardar</button>`})}
function doDocente(id){act(()=>{const s=SOL(id);s.docenteId=leer(['dsel']).dsel;const d=docenteDe(s);hist(s,'Docente supervisor: '+(d?d.nombre:'sin asignar'));log('Cambio de docente',desc(s)+' → '+(d?d.nombre:'sin asignar'));cerrarModal()})}

/* ---- matrícula financiera ---- */
let selMat=new Set();
function vMatricula(){F.mat=F.mat||{q:'',mat:'',con:'con'};const f=F.mat;curTabla=tablaMat;selMat=new Set();
 return `<div class="alert info">${ic('info')}<div class="t">Ningún estudiante queda con escenario confirmado sin matrícula financiera vigente. Al marcar “Matriculado financieramente”, las asignaciones aprobadas se confirman automáticamente; si se retira, la confirmación se revierte.</div></div><div style="height:14px"></div>
 <div class="filters"><input class="q" type="search" placeholder="Buscar estudiante" value="${esc(f.q)}" oninput="F.mat.q=this.value;tablaMat()" aria-label="Buscar"><select onchange="F.mat.mat=this.value;tablaMat()" aria-label="Estado"><option value="">Todos los estados</option>${Object.entries(MAT).map(([k,t])=>`<option value="${k}" ${f.mat===k?'selected':''}>${t}</option>`).join('')}</select><select onchange="F.mat.con=this.value;tablaMat()" aria-label="Escenario"><option value="con" ${f.con==='con'?'selected':''}>Con escenario aprobado</option><option value="" ${f.con===''?'selected':''}>Todos los estudiantes</option></select><span class="spacer"></span><button class="btn" onclick="importarMatricula()">${ic('up')} Cargar Excel de financiera</button></div><div id="tbl"></div>`}
function listaMat(){const f=F.mat,q=norm(f.q);return estP().filter(e=>{const s=solActiva(e.id);if(f.con==='con'&&!(s&&ASIG.includes(s.estado)))return false;if(q&&!norm(nombreCompleto(e)+' '+e.documento+' '+e.codigo).includes(q))return false;if(f.mat&&e.matricula!==f.mat)return false;return true}).sort((a,b)=>nombreCompleto(a).localeCompare(nombreCompleto(b)))}
function tablaMat(){const l=listaMat();
 $('#tbl').innerHTML=`<div class="bulk"><span id="nsel">${selMat.size} seleccionados</span><select id="bulkmat" aria-label="Estado a aplicar">${Object.entries(MAT).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select><button class="btn sm pri" onclick="aplicarMat()">Aplicar a seleccionados</button></div><p class="count">${l.length} estudiantes</p>`+(l.length?`<div class="tbl"><table><thead><tr><th><input type="checkbox" aria-label="Seleccionar todos" onchange="document.querySelectorAll('.cm').forEach(c=>{c.checked=this.checked;this.checked?selMat.add(c.value):selMat.delete(c.value)});$('#nsel').textContent=selMat.size+' seleccionados'"></th><th>Estudiante</th><th>Código</th><th>Escenario</th><th>Estado de la asignación</th><th>Matrícula financiera</th><th>Actualizado</th></tr></thead><tbody>${l.map(e=>{const s=solActiva(e.id);return `<tr><td><input class="cm" type="checkbox" value="${e.id}" ${selMat.has(e.id)?'checked':''} aria-label="Seleccionar ${esc(nombreCompleto(e))}" onchange="this.checked?selMat.add(this.value):selMat.delete(this.value);$('#nsel').textContent=selMat.size+' seleccionados'"></td><td><b>${esc(nombreCompleto(e))}</b><span class="sub">${esc(e.documento)}</span></td><td>${esc(e.codigo||'—')}</td><td>${esc(nombreEsc(s&&ESC(s.escenarioId)))}</td><td>${chipSol(s)}</td><td><select onchange="setMatricula('${e.id}',this.value)" aria-label="Matrícula financiera" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)">${Object.entries(MAT).map(([k,t])=>`<option value="${k}" ${e.matricula===k?'selected':''}>${t}</option>`).join('')}</select></td><td class="small">${e.matriculaFecha?fDL(e.matriculaFecha):'—'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="card empty"><b>No hay estudiantes con estos filtros</b>Cambia el filtro a “Todos los estudiantes” para ver a quienes aún no tienen escenario.</div>`)}
function aplicarMat(){if(!selMat.size){toast('Selecciona al menos un estudiante.','err');return}const v=$('#bulkmat').value;const ids=[...selMat];act(()=>{let n=0;ids.forEach(id=>{const e=E(id);if(e&&e.matricula!==v){e.matricula=v;e.matriculaFecha=ahora();if(v!=='matriculado'&&solActiva(id))notificar('matricula','est:'+id,'Tu matrícula financiera está pendiente.');n++}});log('Actualización masiva de matrícula',`${n} estudiantes → ${MAT[v]}`);toast(n+' estudiantes actualizados')})}

/* ---- docentes ---- */
function solsDocente(dId,pid){return S.solicitudes.filter(s=>s.periodoId===(pid||per().id)&&ASIG.includes(s.estado)&&(docenteDe(s)||{}).id===dId)}
function vDocentes(){return `<div class="row" style="margin-bottom:14px"><span class="spacer"></span><button class="btn pri" onclick="formDoc()">${ic('plus')} Nuevo docente</button></div>`+(S.docentes.length?`<div class="tbl"><table><thead><tr><th>Docente</th><th>Documento</th><th>Contacto</th><th>Áreas</th><th>Estudiantes ${esc(per().codigo)}</th><th>Seguimientos</th><th></th></tr></thead><tbody>${S.docentes.map(d=>{const ss=solsDocente(d.id);return `<tr><td><b>${esc(d.nombre)}</b></td><td>${esc(d.documento)}</td><td class="small">${esc(d.email||'')}<span class="sub">${esc(d.telefono||'')}</span></td><td class="small">${esc(d.areas||'—')}</td><td>${ss.length}</td><td>${S.seguimientos.filter(g=>ss.some(s=>s.id===g.solicitudId)).length}</td><td><button class="btn sm" onclick="formDoc('${d.id}')">Editar</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="card empty"><b>Aún no hay docentes</b>Registra a los docentes supervisores para asociarlos a escenarios.</div>`)}
function formDoc(id){const d=id?D(id):{};modal(id?'Editar docente':'Nuevo docente',`<div class="form">${fld('Nombre completo','dnombre',d.nombre,'text',{req:1,cls:'full'})}${fld('Documento (para ingresar)','ddoc',d.documento,'text',{req:1})}${fld('Correo','demail',d.email,'email')}${fld('Teléfono','dtel',d.telefono)}${fld('Áreas que supervisa','dareas',d.areas,'text',{ph:'Ej.: Clínica'})}</div>`,{foot:`${id&&!S.solicitudes.some(s=>s.docenteId===id)&&!S.escenarios.some(e=>e.docenteId===id)?`<button class="btn danger" onclick="act(()=>{const d=D('${id}');S.docentes=S.docentes.filter(x=>x.id!=='${id}');log('Eliminación de docente',d.nombre);cerrarModal()})">Eliminar</button><span class="spacer"></span>`:''}<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="guardarDoc('${id||''}')">Guardar docente</button>`})}

 ${l.length?`<div class="escs">${l.map(x=>cardEsc(x,e,bloq)).join('')}</div>`:`<div class="card empty"><b>No hay ${tipo==='vacante'?'vacantes':'escenarios'} con estos filtros</b>Prueba con otros filtros.</div>`}</div>`}
function confSel(id){const es=ESC(id);const vac=es.tipo==='vacante';
 modal(vac?'Confirmar postulación':'Confirmar selección',`<div class="stack"><p>Vas a ${vac?'postularte a':'seleccionar'} <b>${esc(nombreEsc(es))}</b> (${esc(es.area)}, ${esc(es.ciudad||'')}).</p>${es.requiereEntrevista?`<div class="alert warn">${ic('alert')}<div class="t"><b>Este escenario requiere proceso de entrevista. La selección del escenario no garantiza la asignación.</b>${es.fechasEntrevista?'<br>Fechas: '+esc(es.fechasEntrevista):''}${es.modalidadEntrevista?' · Modalidad: '+esc(es.modalidadEntrevista):''}</div></div>`:`<div class="alert info">${ic('info')}<div class="t">Tu selección quedará pendiente de validación por la coordinación. La asignación se confirma cuando tengas matrícula financiera vigente.</div></div>`}<p class="small muted">Solo puedes tener una selección activa a la vez.</p></div>`,{foot:`<button class="btn ghost" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="seleccionarEst('${id}')">${vac?'Confirmar postulación':'Confirmar selección'}</button>`})}
function seleccionarEst(escId){act(()=>{const est=yo(),es=ESC(escId);const p=perDe(est);if(!selAbierta(p)&&!est.cambioHabilitado)throw new Error('El período de selección no está abierto.');if(vencida(es))throw new Error('La fecha límite de postulación ya pasó.');const s=crearSolicitud(est,es,es.tipo==='vacante'?'Postulación realizada por el estudiante':'Selección realizada por el estudiante');est.cambioHabilitado=false;
 notificar('seleccion','est:'+est.id,`Tu selección de escenario fue registrada: ${nombreEsc(es)}.`);if(es.requiereEntrevista)notificar('entrevista','est:'+est.id,'Este escenario requiere entrevista. La selección del escenario no garantiza la asignación.');
 log(es.tipo==='vacante'?'Postulación a vacante':'Selección de escenario',desc(s));cerrarModal();toast('Tu selección fue registrada');view='postulaciones'})}
function vPostulaciones(){const e=yo();const l=S.solicitudes.filter(s=>s.estudianteId===e.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 if(!l.length)return `<div class="card empty"><b>Aún no tienes postulaciones</b>Elige un escenario o una vacante para empezar.<div style="margin-top:12px"><button class="btn pri" onclick="go('escenarios')">Ver escenarios</button></div></div>`;
 return `<div class="stack">${l.map(s=>{const es=ESC(s.escenarioId),en=s.entrevista;const puede=['pendiente_validacion','pendiente_entrevista','asignacion_provisional'].includes(s.estado)||(s.estado==='confirmada'&&e.cambioHabilitado);return `<div class="card"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:220px"><span class="small" style="color:${areaCol(es.area)};font-weight:700">${esc(es.area)}${es.tipo==='vacante'?' · Vacante':''}</span><h3 style="margin:2px 0 4px">${esc(nombreEsc(es))}</h3><p class="small muted" style="margin:0">Registrada el ${fDH(s.fecha)}</p></div>${chipSol(s)}</div>
 ${en?`<div class="alert ${en.estado==='Aprobado'?'ok':en.estado==='No aprobado'?'bad':'warn'}" style="margin-top:12px">${ic('chat')}<div class="t"><b>Entrevista: ${esc(en.estado)}</b>${en.fecha?' · '+fDH(en.fecha):' · Fecha por confirmar'}${es.modalidadEntrevista?' · '+esc(es.modalidadEntrevista):''}${en.observaciones&&en.estado!=='Pendiente'?'<br>'+esc(en.observaciones):''}</div></div>`:''}
 <ul class="tl" style="margin-top:14px">${(s.historial||[]).map(h=>`<li><div class="d">${fDH(h.fecha)}</div><div class="tx">${esc(h.texto)}</div></li>`).join('')}</ul>${puede?`<button class="btn danger sm" onclick="confirmar('Cancelar selección','<p>Se liberará tu cupo en ${esc(esc(es.nombre))}. Podrás elegir otro escenario mientras el período de selección esté abierto.</p>',()=>cancelarEst('${s.id}'),'Cancelar selección',true)">Cancelar selección</button>`:''}</div>`}).join('')}</div>`}
function cancelarEst(id){act(()=>{const s=SOL(id),e=yo();if(s.estudianteId!==e.id)throw new Error('No autorizado.');if(s.estado==='confirmada'&&!e.cambioHabilitado)throw new Error('Tu asignación está confirmada. Solo la coordinación puede habilitar un cambio.');s.estado='anulada';s.fechaConfirmacion=null;hist(s,'Cancelada por el estudiante');log('Cancelación de selección',desc(s));toast('Selección cancelada')})}
function vMiAsig(){const e=yo(),s=solActiva(e.id);if(!s||!ASIG.includes(s.estado))return `<div class="card empty"><b>Aún no tienes una asignación</b>${s?'Tu selección está en trámite: '+esc(textoSol(s))+'.':'Elige un escenario para iniciar tu proceso.'}</div>`;const es=ESC(s.escenarioId),d=docenteDe(s),p=perDe(e);
 return `<div class="stack">${s.estado==='confirmada'?`<div class="alert ok">${ic('check')}<div class="t"><b>Escenario de práctica confirmado</b> el ${fDL(s.fechaConfirmacion)}.</div></div>`:`<div class="alert warn">${ic('alert')}<div class="t"><b>Asignación provisional.</b> Tu escenario quedará confirmado cuando tu matrícula financiera esté vigente.</div></div>`}
 <div class="grid2"><div class="card"><h3>${esc(nombreEsc(es))}</h3><dl class="dl">${[['Área',es.area],['Ciudad',es.ciudad],['Dirección',es.direccion],['Jornada',es.jornada],['Contacto',es.contacto],['Teléfono',es.telefono],['Correo',es.email],['Inicio de práctica',fD(p.inicioPractica)],['Fin del período',fD(p.fin)]].filter(x=>x[1]).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div>
 <div class="card"><h3>Docente supervisor</h3>${d?`<dl class="dl"><div><dt>Nombre</dt><dd>${esc(d.nombre)}</dd></div><div><dt>Correo</dt><dd>${esc(d.email||'—')}</dd></div><div><dt>Teléfono</dt><dd>${esc(d.telefono||'—')}</dd></div></dl>`:'<p class="muted">La coordinación asignará tu docente supervisor.</p>'}</div></div></div>`}
function vMiMat(){const e=yo(),s=solActiva(e.id),p=perDe(e);return `<div class="card" style="max-width:720px"><div class="row"><h3 style="margin:0;flex:1">Matrícula financiera ${esc(p.codigo)}</h3>${chipMat(e.matricula)}</div><p style="margin-top:14px">${e.matricula==='matriculado'?'Tu matrícula financiera está vigente.':'La matrícula financiera vigente es requisito para que tu escenario de práctica quede confirmado.'}</p>${s&&s.estado==='asignacion_provisional'&&e.matricula!=='matriculado'?`<div class="alert warn">${ic('alert')}<div class="t">Tu escenario ya fue aprobado y está esperando tu matrícula financiera.</div></div>`:''}<p class="small muted" style="margin-top:12px">Fechas de matrícula: ${fD(p.matriculaIni)} al ${fD(p.matriculaFin)}. ${e.matriculaFecha?'Última actualización: '+fDL(e.matriculaFecha)+'.':''}</p></div>`}
function vMiCarta(){const e=yo(),s=solActiva(e.id);const cartas=S.cartas.filter(c=>c.estudianteId===e.id);const org=s&&esCarta(s);
 if(!org&&!cartas.length)return `<div class="card empty"><b>La Carta Aval aplica a prácticas del área ${esc(S.config.cartaAreas.join(', '))}</b>${s?'Tu escenario actual no requiere Carta Aval.':'Cuando tengas un escenario confirmado en esta área, podrás descargarla aquí.'}</div>`;
 const cond=[['Escenario del área organizacional',!!org],['Selección aprobada (y entrevista, si aplica)',!!(s&&ASIG.includes(s.estado))],['Matrícula financiera vigente',e.matricula==='matriculado'],['Escenario confirmado',!!(s&&s.estado==='confirmada')]];
 return `<div class="grid2"><div class="card stack"><h3>Carta Aval</h3>${elegibleCarta(s)?`<div class="alert ok">${ic('check')}<div class="t"><b>Tu Carta Aval está disponible.</b></div></div><button class="btn pri" onclick="generarCarta('${s.id}')">${ic('down')} ${cartas.some(c=>c.solicitudId===s.id)?'Generar y descargar de nuevo':'Generar y descargar'}</button>`:`<p class="muted">Se habilita cuando se cumplan estas condiciones:</p><ul style="list-style:none;padding:0;margin:0">${cond.map(([t,ok])=>`<li style="display:flex;gap:8px;padding:5px 0;color:${ok?'var(--ok)':'var(--muted)'}">${ok?ic('tick'):ic('x')} ${t}</li>`).join('')}</ul>`}</div>
 <div class="card"><h3>Cartas generadas</h3>${cartas.length?cartas.map(c=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${esc(c.codigo)}</b><div class="small muted">${fDH(c.fecha)}</div></div><button class="btn sm" onclick="descargarCarta('${c.id}')">PDF</button></div>`).join(''):'<p class="muted">Aún no has generado tu carta.</p>'}</div></div>`}
function vNotifs(){const l=misNotifs();const html=l.length?`<div class="card" style="padding:0">${l.map(n=>`<div class="notif ${n.leida?'':'new'}">${ic('bell')}<div><div>${esc(n.texto)}</div><div class="d">${fDH(n.fecha)}</div></div></div>`).join('')}</div>`:'<div class="card empty"><b>No tienes notificaciones</b></div>';if(l.some(n=>!n.leida)){l.forEach(n=>n.leida=true);guardar();setTimeout(()=>{document.querySelectorAll('.nav .badge, .dotn').forEach(b=>b.remove())},1500)}return html}

/* ================= DOCENTE ================= */
function vDocInicio(){const d=D(sess.id),l=solsDocente(d.id);const gs=S.seguimientos.filter(g=>l.some(s=>s.id===g.solicitudId));const sin=l.filter(s=>!segsDe(s.id).length).length;const alert=l.filter(s=>{const g=segsDe(s.id);const u=g[g.length-1];return u&&(u.estadoProceso.includes('alerta')||u.estadoProceso==='Suspendido')}).length;
 return `<div class="stack"><div class="hero"><div><h2>Hola, ${esc(d.nombre.split(' ')[0])}</h2><p class="muted">Período ${esc(per().codigo)}</p></div><button class="btn pri" onclick="go('supervision')">Registrar seguimiento</button></div><div class="kpis">${kpi(l.length,'Estudiantes asignados','info','misest')}${kpi(l.filter(s=>s.estado==='confirmada').length,'Confirmados','ok')}${kpi(sin,'Sin seguimiento aún','warn','supervision')}${kpi(alert,'Procesos con alertas','bad','supervision')}${kpi(gs.length,'Seguimientos registrados','', 'seguimientos')}</div><div class="grid2">${vCalendario(per())}<div class="card"><h3>Últimos seguimientos</h3>${gs.sort((a,b)=>b.creado.localeCompare(a.creado)).slice(0,6).map(g=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(nombreCompleto(E(g.estudianteId)))}</b> <span class="small muted">· ${fD(g.fecha)} · ${esc(g.tipo)}</span><div class="small">${esc((g.descripcion||g.actividades||'').slice(0,120))}</div></div>`).join('')||'<p class="muted">Aún no hay seguimientos.</p>'}</div></div></div>`}
function vMisEst(){const l=solsDocente(sess.id);if(!l.length)return `<div class="card empty"><b>No tienes estudiantes asignados en ${esc(per().codigo)}</b>Cambia el período en la parte superior para ver períodos anteriores.</div>`;
 return `<p class="count">${l.length} estudiantes</p><div class="tbl"><table><thead><tr><th>Estudiante</th><th>Documento</th><th>Escenario</th><th>Área</th><th>Período</th><th>Estado</th><th>Contacto</th><th>Seguimiento</th><th></th></tr></thead><tbody>${l.map(s=>{const e=E(s.estudianteId),es=ESC(s.escenarioId),g=segsDe(s.id);return `<tr><td><b>${esc(nombreCompleto(e))}</b></td><td>${esc(e.documento)}</td><td>${esc(nombreEsc(es))}</td><td>${esc(es.area)}</td><td>${esc(per().codigo)}</td><td>${chipSol(s)}</td><td class="small">${esc(e.email||'')}<span class="sub">${esc(e.telefono||'')}</span></td><td class="small">${g.length} · ${g.length?'último '+fD(g[g.length-1].fecha):'sin registros'}</td><td><button class="btn sm" onclick="supSel='${s.id}';go('supervision')">Ficha</button></td></tr>`}).join('')}</tbody></table></div>`}
function vSegs(){const l=solsDocente(sess.id);const gs=S.seguimientos.filter(g=>l.some(s=>s.id===g.solicitudId)).sort((a,b)=>(b.fecha+b.creado).localeCompare(a.fecha+a.creado));return gs.length?`<div class="card"><ul class="tl">${gs.map(g=>`<li><div class="d">${fD(g.fecha)} · ${esc(g.tipo)}</div><div class="ty">${esc(nombreCompleto(E(g.estudianteId)))}</div>${g.descripcion?`<div class="tx">${esc(g.descripcion)}</div>`:''}${g.compromisos?`<div class="tx"><b>Compromisos:</b> ${esc(g.compromisos)}</div>`:''}<div class="mt">${esc(g.estadoProceso)}</div></li>`).join('')}</ul></div>`:'<div class="card empty"><b>Aún no hay seguimientos en este período</b>Regístralos desde Supervisión.</div>'}
function vDocRep(){const n=solsDocente(sess.id).length;return `<div class="grid2"><div class="card stack"><h3>Mis estudiantes</h3><p class="muted small">${n} estudiantes del período ${esc(per().codigo)} con estado y resumen de seguimiento.</p><div class="row"><button class="btn pri" onclick="run(()=>reporte3('pdf','${sess.id}'))">${ic('down')} PDF</button><button class="btn" onclick="run(()=>reporte3('xlsx','${sess.id}'))">${ic('down')} Excel</button></div></div><div class="card stack"><h3>Fichas de seguimiento</h3><p class="muted small">Abre la ficha de cada estudiante en Supervisión y descarga su línea de tiempo en PDF.</p><button class="btn" onclick="go('supervision')">Ir a Supervisión</button></div></div>`}

/* ================= RUTAS ================= */
const VIEWS={
 admin:{dashboard:vDashboard,periodos:vPeriodos,estudiantes:vEstudiantes,escenarios:()=>vEscAdmin('escenario'),vacantes:()=>vEscAdmin('vacante'),entrevistas:vEntrevistas,asignaciones:vAsignaciones,matricula:vMatricula,docentes:vDocentes,supervision:vSupervision,cartas:vCartas,reportes:vReportes,config:vConfig},
 est:{inicio:vEstInicio,escenarios:()=>vEstEsc('escenario'),postulaciones:vPostulaciones,asignacion:vMiAsig,matricula:vMiMat,vacantes:()=>vEstEsc('vacante'),carta:vMiCarta,calendario:()=>vCalendario(),notifs:vNotifs},
 doc:{inicio:vDocInicio,misest:vMisEst,supervision:vSupervision,seguimientos:vSegs,calendario:()=>vCalendario(),reportes:vDocRep},
 prog:{programa:vPrograma,calendario:()=>vCalendario()}
};
cargar();
try{const r=localStorage.getItem(SKEY);if(r)sess=JSON.parse(r)}catch(e){}
sincronizar();render();getDl();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))cerrarModal()});
</script>
</body>
</html>
